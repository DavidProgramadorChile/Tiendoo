<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendoo — Venta de Arroz en Perú 🇵🇪</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FFFFFF;
            color: #000000;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col selection:bg-black selection:text-white">

    <!-- CABECERA MINIMALISTA CON BANDERA Y LOGO ELEGANTE -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 flex flex-col">
        <!-- Franja de la bandera del Perú dividida en 3 columnas exactas (1/3 rojo, 1/3 blanco, 1/3 rojo) -->
        <div class="grid grid-cols-3 w-full h-2.5 shadow-[0_1px_3px_rgba(0,0,0,0.15)]">
            <div class="bg-[#D91023]"></div>
            <div class="bg-white border-l border-r border-black/15"></div>
            <div class="bg-[#D91023]"></div>
        </div>

        <div class="px-4 py-3 flex items-center justify-between">
            <button id="menu-btn" class="w-10 h-10 flex items-center justify-center text-xl text-black hover:bg-gray-100 rounded-full transition-colors cursor-pointer">
                <i class="fa-solid fa-bars"></i>
            </button>
            
            <!-- Logo con tamaño destacado y sombra tipográfica elegante -->
            <div class="text-center">
                <h1 class="text-base font-black tracking-[0.25em] uppercase text-black drop-shadow-[0_2px_4px_rgba(0,0,0,0.2)]">
                    TIENDOO
                </h1>
            </div>

            <div class="w-10 h-10"></div>
        </div>
    </header>

    <!-- PANEL DE RESUMEN SUPERIOR CON SOMBRA ELEGANTE -->
    <section class="bg-gray-100/90 backdrop-blur-md border-b border-gray-200 px-4 py-3 shadow-[0_4px_12px_rgba(0,0,0,0.06)] relative z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <span id="selected-summary-text" class="text-xs font-bold text-black uppercase tracking-wide">0 productos seleccionados</span>
                <div class="bg-gray-300 h-1.5 rounded-full mt-1.5 w-36 overflow-hidden">
                    <div id="progress-bar" class="bg-black h-full w-0 transition-all duration-300"></div>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[11px] text-gray-600 block">Total Parcial</span>
                <span id="header-total-price" class="text-sm font-extrabold text-black">S/ 0.00</span>
            </div>
        </div>
    </section>

    <!-- CATEGORÍAS NUMERADAS -->
    <nav class="py-3 px-4 overflow-x-auto hide-scrollbar border-b border-gray-200 bg-white sticky top-[71px] z-30">
        <div class="flex space-x-2 min-w-max" id="categories-container">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-black text-white transition-all cursor-pointer shadow-sm">Todos</button>
            <button onclick="filterCategory('Cat 01')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all cursor-pointer">Categoría 01 (Extra)</button>
            <button onclick="filterCategory('Cat 02')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all cursor-pointer">Categoría 02 (Añejo)</button>
            <button onclick="filterCategory('Cat 03')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all cursor-pointer">Categoría 03 (Especial)</button>
        </div>
    </nav>

    <!-- CUADRÍCULA DE PRODUCTOS -->
    <main class="flex-1 max-w-md w-full mx-auto px-4 py-5 mb-28">
        <div id="products-grid" class="grid grid-cols-2 gap-3.5"></div>
    </main>

    <!-- BOTÓN FLOTANTE DE WHATSAPP (SE OCULTA HACIA ABAJO CUANDO HAY PRODUCTOS) -->
    <a id="whatsapp-float-btn" href="https://wa.me/51986389251?text=Hola%20Tiendoo,%20deseo%20realizar%20una%20consulta%20sobre%20sus%20arroces." target="_blank" class="fixed bottom-6 right-5 z-30 bg-[#25D366] hover:bg-[#20ba5a] text-white w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-xl transition-all duration-300 hover:scale-105 cursor-pointer">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- BARRA INFERIOR DE ACCIÓN RÁPIDA CON SOMBRA PRONUNCIADA -->
    <div id="checkout-bar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 p-4 z-40 shadow-[0_-8px_25px_rgba(0,0,0,0.12)] transition-transform duration-300 translate-y-full">
        <div class="max-w-md mx-auto flex items-center justify-between gap-3">
            <div>
                <span class="text-xs text-gray-600 block">Total a Pagar</span>
                <span id="footer-total-price" class="text-lg font-black text-black">S/ 0.00</span>
            </div>
            <button onclick="openCheckoutModal()" class="flex-1 bg-black hover:bg-gray-800 text-white font-bold py-3 px-6 rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
                <span>Revisar y Comprar</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- MODAL / PANEL LATERAL -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs hidden transition-opacity opacity-0">
        <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white flex flex-col shadow-2xl transition-transform transform translate-x-full duration-300" id="cart-drawer">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between bg-gray-100">
                <h2 class="font-extrabold text-base uppercase tracking-wider flex items-center gap-2 text-black">
                    <i class="fa-solid fa-bag-shopping text-black"></i> TU PEDIDO
                </h2>
                <button onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-gray-200 hover:bg-gray-300 flex items-center justify-center text-black transition-colors cursor-pointer">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="modal-body-content"></div>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONALIDAD -->
    <script>
        const products = [
            { id: 1, name: "P.D. Rojo", price: 165.00, category: "Cat 01", image: "img/arroz.jpg" },
            { id: 2, name: "P.D. Naranja", price: 155.00, category: "Cat 01", image: "img/arroz.jpg" },
            { id: 3, name: "P.D. Azul", price: 170.00, category: "Cat 01", image: "img/arroz.jpg" },
            { id: 4, name: "P.D. Añejo", price: 190.00, category: "Cat 02", image: "img/arroz.jpg" },
            { id: 5, name: "Caserita Amarilla", price: 140.00, category: "Cat 03", image: "img/arroz.jpg" },
            { id: 6, name: "Caserita Amarilla F.", price: 150.00, category: "Cat 03", image: "img/arroz.jpg" },
            { id: 7, name: "Caserita Amarilla Laminado F.", price: 165.00, category: "Cat 03", image: "img/arroz.jpg" },
            { id: 8, name: "Cholita Fucsia F.", price: 165.00, category: "Cat 02", image: "img/arroz.jpg" }
        ];

        const peruvianProvinces = [
            "Lima", "Callao", "Arequipa", "Trujillo", "Chiclayo", "Piura", "Iquitos", "Cusco", 
            "Chimbote", "Huancayo", "Tacna", "Juliaca", "Ica", "Cajamarca", "Pucallpa", 
            "Sullana", "Ayacucho", "Chincha Alta", "Huánuco", "Huaraz", "Tumbes", "Puno", 
            "Tarapoto", "Huaral", "Pisco", "Talara", "Jaén", "San Román", "Barranca", 
            "Abancay", "Cerro de Pasco", "Moquegua", "Puerto Maldonado", "Bagua", "Chachapoyas", 
            "Yurimaguas", "Tingo María", "Sicuani", "Camaná", "Mollendo", "Otra Provincia"
        ];

        let cart = {};
        let currentFilter = 'all';
        let isCheckoutStep = false;
        let selectedProvince = '';

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            filtered.forEach(product => {
                const qty = cart[product.id] || 0;
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-2xl p-3 flex flex-col justify-between shadow-xs hover:shadow-md transition-shadow relative overflow-hidden";
                
                card.innerHTML = `
                    <div class="relative w-full h-32 bg-gray-100 rounded-xl mb-2.5 overflow-hidden flex items-center justify-center">
                        <img src="${product.image}" alt="${product.name}" class="object-cover w-full h-full" onerror="this.src='https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=400'">
                        <span class="absolute top-2 left-2 bg-black text-white text-[9px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">${product.category}</span>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-black line-clamp-2 mb-1">${product.name}</h3>
                        <p class="text-sm font-extrabold text-black">S/ ${product.price.toFixed(2)}</p>
                    </div>
                    <div class="mt-3 pt-2 border-t border-gray-100 flex items-center justify-between">
                        <span class="text-[10px] text-gray-500 font-medium">Bolsa / Saco</span>
                        <div>
                            ${qty === 0 ? `
                                <button onclick="updateQty(${product.id}, 1)" class="w-7 h-7 rounded-full bg-black hover:bg-gray-800 text-white flex items-center justify-center text-xs shadow-sm transition-transform active:scale-90 cursor-pointer">
                                    <i class="fa-solid fa-plus text-[10px]"></i>
                                </button>
                            ` : `
                                <div class="flex items-center space-x-1 bg-gray-100 rounded-full p-0.5 border border-gray-200">
                                    <button onclick="updateQty(${product.id}, -1)" class="w-5 h-5 rounded-full bg-black text-white flex items-center justify-center text-[9px] hover:bg-gray-800 transition-colors cursor-pointer">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                    <span class="text-xs font-bold px-1 text-black">${qty}</span>
                                    <button onclick="updateQty(${product.id}, 1)" class="w-5 h-5 rounded-full bg-black text-white flex items-center justify-center text-[9px] hover:bg-gray-800 transition-colors cursor-pointer">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            updateSummary();
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition-all cursor-pointer";
            });
            event.target.className = "cat-btn px-4 py-1.5 rounded-full text-xs font-bold bg-black text-white transition-all cursor-pointer shadow-sm";
            renderProducts();
        }

        function updateQty(productId, change) {
            if (!cart[productId]) cart[productId] = 0;
            cart[productId] += change;
            if (cart[productId] <= 0) {
                delete cart[productId];
            }
            renderProducts();
        }

        function updateSummary() {
            let totalItems = 0;
            let totalPrice = 0;

            Object.keys(cart).forEach(id => {
                const prod = products.find(p => p.id == id);
                if (prod) {
                    totalItems += cart[id];
                    totalPrice += prod.price * cart[id];
                }
            });

            document.getElementById('selected-summary-text').innerText = `${totalItems} ${totalItems === 1 ? 'producto seleccionado' : 'productos seleccionados'}`;
            
            const progressPercent = Math.min((totalItems / 8) * 100, 100);
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const formattedPrice = `S/ ${totalPrice.toFixed(2)}`;
            document.getElementById('header-total-price').innerText = formattedPrice;
            document.getElementById('footer-total-price').innerText = formattedPrice;

            const checkoutBar = document.getElementById('checkout-bar');
            const waBtn = document.getElementById('whatsapp-float-btn');

            if (totalItems > 0) {
                checkoutBar.classList.remove('translate-y-full');
                waBtn.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
            } else {
                checkoutBar.classList.add('translate-y-full');
                waBtn.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                closeCartModal();
            }
        }

        function openCheckoutModal() {
            isCheckoutStep = true;
            renderCartModalContent();
            openModal();
        }

        function openModal() {
            const modal = document.getElementById('cart-modal');
            const drawer = document.getElementById('cart-drawer');
            const waBtn = document.getElementById('whatsapp-float-btn');
            
            waBtn.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                drawer.classList.remove('translate-x-full');
            }, 10);
        }

        function closeCartModal() {
            const modal = document.getElementById('cart-modal');
            const drawer = document.getElementById('cart-drawer');
            const waBtn = document.getElementById('whatsapp-float-btn');
            
            drawer.classList.add('translate-x-full');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                isCheckoutStep = false;
                
                let totalItems = 0;
                Object.keys(cart).forEach(id => { totalItems += cart[id]; });
                
                if (totalItems === 0) {
                    waBtn.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                }
            }, 300);
        }

        function renderCartModalContent() {
            const container = document.getElementById('modal-body-content');
            
            let totalItems = 0;
            let totalPrice = 0;
            Object.keys(cart).forEach(id => {
                const prod = products.find(p => p.id == id);
                if (prod) {
                    totalItems += cart[id];
                    totalPrice += prod.price * cart[id];
                }
            });

            if (totalItems === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fa-solid fa-basket-shopping text-4xl text-gray-300 mb-3"></i>
                        <p class="text-sm font-semibold text-gray-700">Tu carrito está vacío</p>
                        <p class="text-xs text-gray-500 mt-1">Selecciona tus tipos de arroz favoritos.</p>
                    </div>
                `;
                return;
            }

            if (!isCheckoutStep) {
                let itemsHtml = '';
                Object.keys(cart).forEach(id => {
                    const prod = products.find(p => p.id == id);
                    itemsHtml += `
                        <div class="flex items-center justify-between py-3 border-b border-gray-100">
                            <div class="flex items-center space-x-3">
                                <img src="${prod.image}" class="w-12 h-12 object-cover rounded-lg bg-gray-100 border border-gray-200">
                                <div>
                                    <h4 class="text-xs font-bold text-black">${prod.name}</h4>
                                    <span class="text-xs text-gray-600">S/ ${prod.price.toFixed(2)} c/u</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <div class="flex items-center space-x-1.5 bg-gray-100 rounded-full p-0.5 border border-gray-200">
                                    <button onclick="updateQty(${prod.id}, -1); renderCartModalContent();" class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[10px] cursor-pointer hover:bg-gray-800">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                    <span class="text-xs font-bold px-1">${cart[prod.id]}</span>
                                    <button onclick="updateQty(${prod.id}, 1); renderCartModalContent();" class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[10px] cursor-pointer hover:bg-gray-800">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = `
                    <div class="space-y-2">${itemsHtml}</div>
                    <div class="pt-4 mt-4 border-t border-gray-200 space-y-2">
                        <div class="flex justify-between text-xs text-gray-600">
                            <span>Subtotal</span>
                            <span>S/ ${totalPrice.toFixed(2)}</span>
                        </div>
                        <div class="flex justify-between text-xs text-gray-600">
                            <span>Envío en Perú</span>
                            <span class="text-black font-semibold">Calculado por WhatsApp</span>
                        </div>
                        <div class="flex justify-between text-base font-extrabold text-black pt-2 border-t border-gray-200">
                            <span>Total</span>
                            <span class="text-black">S/ ${totalPrice.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="pt-6">
                        <button onclick="isCheckoutStep=true; renderCartModalContent();" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
                            <span>Continuar con Datos de Envío</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <form id="whatsapp-order-form" onsubmit="sendWhatsAppOrder(event)" class="space-y-4 pb-12">
                        <div class="flex items-center justify-between">
                            <button type="button" onclick="isCheckoutStep=false; renderCartModalContent();" class="text-xs font-bold text-gray-700 hover:text-black flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-arrow-left"></i> Volver al resumen
                            </button>
                            <span class="text-xs font-bold text-black">Paso 2 de 2</span>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-black uppercase tracking-wider mb-1">Nombre y Apellidos</label>
                            <input type="text" id="client-name" required placeholder="Ej. Juan Pérez Quispe" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-xs text-black focus:outline-none focus:border-black transition-colors">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-black uppercase tracking-wider mb-1">Dirección de Entrega</label>
                            <input type="text" id="client-address" required placeholder="Ej. Av. Arequipa 1234, Dpto 201" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-xs text-black focus:outline-none focus:border-black transition-colors">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-black uppercase tracking-wider mb-1">Número de Teléfono</label>
                            <div class="flex items-center bg-gray-50 border border-gray-200 rounded-xl overflow-hidden focus-within:border-black transition-colors">
                                <div class="flex items-center space-x-1.5 px-3 py-2.5 bg-gray-100 border-r border-gray-200 text-xs font-bold text-black">
                                    <span>🇵🇪</span>
                                    <span>+51</span>
                                </div>
                                <input type="tel" id="client-phone" required maxlength="9" pattern="[0-9]{9}" placeholder="987654321" class="w-full bg-transparent px-3 py-2.5 text-xs text-black focus:outline-none">
                            </div>
                            <span class="text-[10px] text-gray-500 mt-1 block">Ingresa tus 9 dígitos.</span>
                        </div>

                        <!-- SELECTOR DE PROVINCIA PERSONALIZADO -->
                        <div class="relative overflow-visible">
                            <label class="block text-xs font-bold text-black uppercase tracking-wider mb-1">Provincia de Destino</label>
                            <div id="province-dropdown-btn" onclick="toggleProvinceDropdown(event)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-xs text-black flex items-center justify-between cursor-pointer hover:border-black transition-colors">
                                <span id="province-selected-label" class="${selectedProvince ? 'text-black font-semibold' : 'text-gray-400'}">${selectedProvince || 'Selecciona tu provincia...'}</span>
                                <i class="fa-solid fa-chevron-down text-gray-500 text-[10px] transition-transform" id="province-chevron"></i>
                            </div>

                            <div id="province-options-container" class="hidden absolute left-0 right-0 top-[72px] bg-white border border-gray-200 rounded-xl shadow-2xl z-50 p-2">
                                <div class="mb-2">
                                    <input type="text" id="province-search" oninput="filterProvinces(this.value)" placeholder="Buscar provincia..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-black focus:outline-none focus:border-black">
                                </div>
                                <div id="province-list-items" class="max-h-48 overflow-y-auto space-y-1 pr-1"></div>
                            </div>
                        </div>

                        <div class="bg-gray-100 border border-gray-200 p-3 rounded-xl mt-4">
                            <div class="flex justify-between text-xs font-bold text-black mb-1">
                                <span>Total a Pagar:</span>
                                <span>S/ ${totalPrice.toFixed(2)}</span>
                            </div>
                            <p class="text-[10px] text-gray-600">Al confirmar, se generará tu orden ordenada para enviarla directamente por WhatsApp.</p>
                        </div>

                        <button type="submit" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white font-bold py-3.5 px-4 rounded-xl text-xs shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer uppercase tracking-wider">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>Confirmar Pedido por WhatsApp</span>
                        </button>
                    </form>
                `;
                renderProvinceList(peruvianProvinces);
            }
        }

        function toggleProvinceDropdown(event) {
            if (event) event.stopPropagation();
            const container = document.getElementById('province-options-container');
            const chevron = document.getElementById('province-chevron');
            container.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('province-options-container');
            const btn = document.getElementById('province-dropdown-btn');
            if (dropdown && btn && !dropdown.contains(e.target) && !btn.contains(e.target)) {
                dropdown.classList.add('hidden');
                const chevron = document.getElementById('province-chevron');
                if (chevron) chevron.classList.remove('rotate-180');
            }
        });

        function renderProvinceList(provincesArray) {
            const listContainer = document.getElementById('province-list-items');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            if (provincesArray.length === 0) {
                listContainer.innerHTML = `<div class="p-3 text-center text-xs text-gray-500">No se encontró la provincia</div>`;
                return;
            }

            provincesArray.forEach(prov => {
                const item = document.createElement('div');
                item.className = `px-3 py-2.5 text-xs rounded-lg cursor-pointer transition-colors flex items-center justify-between ${selectedProvince === prov ? 'bg-black text-white font-bold' : 'text-gray-800 hover:bg-gray-100'}`;
                item.innerHTML = `
                    <span>${prov}</span>
                    ${selectedProvince === prov ? '<i class="fa-solid fa-check text-white text-[10px]"></i>' : ''}
                `;
                item.onclick = (e) => {
                    e.stopPropagation();
                    selectedProvince = prov;
                    document.getElementById('province-selected-label').innerText = prov;
                    document.getElementById('province-selected-label').className = 'text-black font-semibold';
                    toggleProvinceDropdown();
                };
                listContainer.appendChild(item);
            });
        }

        function filterProvinces(query) {
            const filtered = peruvianProvinces.filter(p => p.toLowerCase().includes(query.toLowerCase()));
            renderProvinceList(filtered);
        }

        function sendWhatsAppOrder(event) {
            event.preventDefault();
            
            const name = document.getElementById('client-name').value.trim();
            const address = document.getElementById('client-address').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            if (!selectedProvince) {
                alert("Por favor, selecciona tu provincia de destino.");
                return;
            }

            if (phone.length !== 9 || isNaN(phone)) {
                alert("Por favor, ingresa un número de celular peruano válido de 9 dígitos.");
                return;
            }

            let orderText = `🛒 *NUEVO PEDIDO - TIENDOO* 🇵🇪\n\n`;
            orderText += `👤 *Cliente:* ${name}\n`;
            orderText += `📱 *Teléfono:* +51 ${phone}\n`;
            orderText += `📍 *Dirección:* ${address}\n`;
            orderText += `🏙️ *Provincia:* ${selectedProvince}\n\n`;
            orderText += `📦 *DETALLE DEL PRODUCTO:* \n`;

            let totalPrice = 0;
            Object.keys(cart).forEach(id => {
                const prod = products.find(p => p.id == id);
                if (prod) {
                    const subtotal = prod.price * cart[id];
                    totalPrice += subtotal;
                    orderText += `• ${prod.name} x ${cart[id]} und. (S/ ${subtotal.toFixed(2)})\n`;
                }
            });

            orderText += `\n💰 *TOTAL A PAGAR: S/ ${totalPrice.toFixed(2)}*\n\n`;
            orderText += `_Enviado desde Tiendoo Web App_`;

            const encodedMessage = encodeURIComponent(orderText);
            const whatsappUrl = `https://wa.me/51986389251?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        window.onload = () => {
            renderProducts();
        };
    </script>
</body>
</html>
